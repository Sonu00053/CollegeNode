<style>
    .subject-card-body {
        max-height: 100px;
        overflow-y: auto;
        scrollbar-width: none;
    }

    .subject-card-body::-webkit-scrollbar {
        display: none;
    }
</style>
<div class="content">
    <div class="card mt-4 shadow-sm">
        <div class="card-header bg-dark text-white">
            {{title}}
        </div>
        <div class="card-body">
            <div class="row mb-3">

                <div class="col-md-5">
                    <label class="form-label">Student ID</label>

                    <div class="input-group">
                        <input type="text" id="student_id" class="form-control" placeholder="Enter Student ID">

                        <button type="button" class="btn btn-primary" id="searchStudent">
                            Search
                        </button>

                        <button type="button" class="btn btn-secondary" id="clearStudent">
                            Clear
                        </button>
                    </div>
                </div>

            </div>
            <table class="table table-bordered" id="example">
                <thead>
                    {{thead}}
                </thead>
                <tbody>
                    {{tableRows}}
                </tbody>
            </table>
        </div>
    </div>
</div>


<div class="modal fade" id="subjectsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    Student Subjects
                </h5>
                <button class="btn-close" data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="row" id="subjectsCards">

                </div>

            </div>

        </div>

    </div>

</div>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>

    $('#searchStudent').on('click', function () {

        const studentId = $('#student_id').val().trim();

        if (!studentId) {

            toastr.warning('Please enter Student ID');
            return;
        }

        const url = new URL(window.location.href);

        url.searchParams.set('student_id', studentId);

        window.location.href = url.toString();
    });


    $('#clearStudent').on('click', function () {

        $('#student_id').val('');

        const url = new URL(window.location.href);

        url.searchParams.delete('student_id');

        window.location.href = url.toString();
    });


    $('#student_id').on('keypress', function (e) {

        if (e.which === 13) {
            $('#searchStudent').click();
        }

    });

</script>


<script>



    document.addEventListener("click", function (e) {

        if (!e.target.classList.contains("view-subjects")) return;

        let subjects = [];

        try {

            subjects = JSON.parse(
                e.target.getAttribute("data-subjects")
            );

        } catch (err) {

            console.log(err);

        }

        let html = "";

        if (subjects.length == 0) {

            html = `
        <div class="col-12">

            <div class="alert alert-warning">
                No Subjects Found
            </div>

        </div>
        `;

        } else {

            subjects.forEach(function (item, index) {

                html += `
            <div class="col-md-4 mb-3">

                <div class="card border-primary shadow">

                    <div class="card-body text-center">

                        <h6>
                            ${index + 1}. ${item}
                        </h6>

                    </div>

                </div>

            </div>
            `;

            });

        }

        document.getElementById("subjectsCards").innerHTML = html;

        const modal = new bootstrap.Modal(
            document.getElementById("subjectsModal")
        );

        modal.show();

    });



    $('#example tbody').on('click', '.ParkingAction', function () {

        let id = $(this).data('id');
        let action = $(this).data('action');
        let $btn = $(this);

        const isAdd = action === 'add';

        Swal.fire({
            title: isAdd ? 'Add Parking?' : 'Remove Parking?',
            text: isAdd
                ? 'Do you want to add parking for this student?'
                : 'Do you want to remove parking for this student?',
            icon: 'warning',

            showCancelButton: true,

            confirmButtonColor: isAdd
                ? '#198754'
                : '#dc3545',

            cancelButtonColor: '#6c757d',

            confirmButtonText: isAdd
                ? 'Yes, Add Parking'
                : 'Yes, Remove Parking'

        }).then((result) => {

            if (!result.isConfirmed) {
                return;
            }

            $btn.prop('disabled', true);

            $.ajax({

                url: "{{CONSTANTS.role}}remove-parking",

                type: "POST",

                dataType: "json",

                data: {
                    id: id,
                    action: action
                },

                success: function (res) {

                    if (res.status) {

                        toastr.success(res.message);

                        setTimeout(() => {
                            location.reload();
                        }, 1000);

                    } else {

                        toastr.error(res.message);

                        $btn.prop('disabled', false);
                    }
                },

                error: function () {

                    toastr.error("Something went wrong.");

                    $btn.prop('disabled', false);
                }
            });

        });

    });
    function Parkingpopup() {
        Swal.fire({
            title: 'Request Pending',
            html: `Please Wait For Admin Approval`,
            icon: 'info',
            showCloseButton: true,
            focusConfirm: false,
            confirmButtonText: 'Close'
        });

    }

</script>
