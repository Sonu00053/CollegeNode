<style>
    /* Chrome, Safari, Edge */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    /* Firefox */
    input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
    }
</style>
<div class="content">
    <div class="card shadow-sm mt-4">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">{{title}}</h5>
        </div>

        <div class="card-body">
            <form action="{{action}}" method="{{method}}" id="receiptForm" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Name *</label>
                        <input type="text" name="name" id="name" value="{{name}}" class="form-control"
                            placeholder="Enter Name">
                        <div id="name_error" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Father Name *</label>
                        <input type="text" name="father_name" id="father_name" value="{{father_name}}"
                            class="form-control" placeholder="Enter Father Name">
                        <div id="father_name_error" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Univ. Roll No. *</label>
                        <input type="number" name="university_roll_no" id="university_roll_no" min="0.01" step="0.01"
                            value="{{university_roll_no}}" class="form-control" placeholder="Enter University Roll No.">
                        <div id="university_roll_no_error" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mobile Number *</label>
                        <input type="text" name="mobile" id="mobile" value="{{mobile}}" maxlength="10"
                            class="form-control" placeholder="Enter Mobile Number">
                        <div id="mobile_error" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Class *</label>
                        <input type="text" name="class" id="class" value="{{class}}" class="form-control"
                            placeholder="Enter Class">
                        <div id="class_error" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">On Account Of *</label>
                        <select name="on_account_of" id="on_account_of" class="form-select">
                            <option value="">Select Account</option>
                            <option value="Degree">Degree</option>
                            <option value="Duplicate Library Card">Duplicate Library Card</option>
                            <option value="Library Books Lost">Library Books Lost</option>
                            <option value="Character/Transfer/College Leaving Certificate">Character/Transfer/College
                                Leaving Certificate</option>
                            <option value="Migration Certificate Attestation">Migration Certificate Attestation</option>
                            <option value="Duplicate DMC/Degree Certificate Attestation">Duplicate DMC/Degree
                                Certificate Attestation</option>
                            <option value="Letter of Recommendation (LOR)">Letter of Recommendation (LOR)</option>
                            <option value="Backlog Certificate">Backlog Certificate</option>
                            <option value="Medium of Instruction (MOI)">Medium of Instruction (MOI)</option>
                            <option value="Other">Other</option>
                        </select>
                        <div id="on_account_of_error" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6" id="other_account_box" style="display:none;">
                        <label class="form-label">Other Account *</label>
                        <input type="text" name="on_account_of_other" id="on_account_of_other"
                            value="{{on_account_of_other}}" class="form-control" placeholder="Enter Other Account">
                        <div id="on_account_of_other_error" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Amount *</label>
                        <input type="number" name="amount" id="amount" value="{{amount}}" min="0.01" step="0.01"
                            class="form-control" placeholder="Enter Amount">
                        <div id="amount_error" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Payment Mode *</label>
                        <select name="payment_mode" id="payment_mode" class="form-select">
                            <option value="Cash">Cash</option>
                            <option value="Online">Online</option>
                            <option value="Cheque">Cheque</option>
                            <!-- <option value="DD">DD</option> -->
                        </select>
                        <div id="payment_mode_error" class="invalid-feedback"></div>
                    </div>

                    <div class="col-md-6" id="transaction_box" style="display:none;">
                        <label class="form-label">Transaction ID *</label>
                        <input type="text" name="transaction_id" id="transaction_id" value="{{transaction_id}}"
                            class="form-control" placeholder="Enter Transaction ID">
                        <div id="transaction_id_error" class="invalid-feedback"></div>
                    </div>

                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-dark">Create Receipt</button>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("receiptForm");
        const account = document.getElementById("on_account_of");
        const payment = document.getElementById("payment_mode");

        const otherBox = document.getElementById("other_account_box");
        const otherInput = document.getElementById("on_account_of_other");
        const transactionBox = document.getElementById("transaction_box");
        const transaction = document.getElementById("transaction_id");

        const error = (field, msg) => {
            document.getElementById(field).classList.add("is-invalid");
            document.getElementById(field + "_error").textContent = msg;
        };

        const clearErrors = () => {
            document.querySelectorAll(".is-invalid").forEach(el => el.classList.remove("is-invalid"));
            document.querySelectorAll(".invalid-feedback").forEach(el => el.textContent = "");
        };

        const toggle = () => {
            otherBox.style.display = account.value === "Other" ? "block" : "none";
            otherInput.required = account.value === "Other";

            transactionBox.style.display = payment.value !== "Cash" ? "block" : "none";
            transaction.required = payment.value !== "Cash";
        };

        account.addEventListener("change", toggle);
        payment.addEventListener("change", toggle);
        toggle();

        document.getElementById("mobile").addEventListener("input", function () {
            this.value = this.value.replace(/\D/g, "").slice(0, 10);
        });

        // Restore selected values
        account.value = "{{on_account_of}}";
        payment.value = "{{payment_mode}}";
        toggle();

        form.addEventListener("submit", async e => {
            e.preventDefault();
            clearErrors();

            let valid = true;

            const fields = {
                name: "Name is required.",
                father_name: "Father Name is required.",
                university_roll_no: "University Roll No. is required.",
                class: "Class is required.",
                on_account_of: "Please select On Account Of."
            };

            Object.entries(fields).forEach(([field, msg]) => {
                if (!document.getElementById(field).value.trim()) {
                    error(field, msg);
                    valid = false;
                }
            });

            const mobile = document.getElementById("mobile").value.trim();
            const amount = document.getElementById("amount").value;
            const university_roll_no = document.getElementById("university_roll_no").value.trim();

            if (!/^\d+$/.test(university_roll_no)) {
                error("university_roll_no", "Only numeric values are allowed.");
                valid = false;
            }

            if (!/^[0-9]{10}$/.test(mobile)) {
                error("mobile", "Enter valid 10 digit mobile number.");
                valid = false;
            }



            if (!amount || !Number.isFinite(Number(amount)) || Number(amount) <= 0) {
                error("amount", "Enter valid amount.");
                valid = false;
            }

            if (account.value === "Other" && !otherInput.value.trim()) {
                error("on_account_of_other", "Other Account is required.");
                valid = false;
            }

            if (payment.value !== "Cash" && !transaction.value.trim()) {
                error("transaction_id", "Transaction ID is required.");
                valid = false;
            }

            if (!valid) {
                document.querySelector(".is-invalid")?.focus();
                return;
            }
            const result = await Swal.fire({
                title: "Confirm Receipt?",
                text: "Are you sure you want to create this receipt?",
                icon: "question",
                showCancelButton: true,
                confirmButtonColor: "#198754",
                cancelButtonColor: "#6c757d",
                confirmButtonText: "Yes, Create Receipt",
                cancelButtonText: "Cancel"
            });

            if (result.isConfirmed) form.submit();
        });
        const message = `{{message}}`;
        const type = `{{messageType}}`;
        const redirect = `{{redirect}}`;
        if (message) {
            Swal.fire({
                toast: true,
                position: "top-end",
                icon: type || "info",
                title: message,
                showConfirmButton: false,
                timer: 2000,
                timerProgressBar: true
            });

            if (redirect) setTimeout(() => location.href = redirect, 2000);
        }
    });
</script>
